<!DOCTYPE html>
<html lang="ca" color-mode="user">

<head>
    <!-- dades tècniques de la pàgina -->
    <meta charset="utf-8">
    <title>{SITE_NAME} :: Registre nou usuari</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"><!-- per a dispositius mòbils -->
    <meta name="author" content="Antonio Bueno (UdG)">
    <!-- estètica de la pàgina -->
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="mvp.css">
    <link rel="stylesheet" href="el_meu.css">
    <!-- per afegir interactivitat a la pàgina -->
    <script defer src="el_meu.js"></script>
</head>

<body>
    <!-- contingut visible de la pàgina -->
    <main>
        <header>
            <h1><a href="/">{SITE_NAME}</a></h1>
            <div>{FEEDBACK}</div>
        </header>
        <section>
            <form method="{METHOD}" action="{REGISTER_URL}">
                <header>
                    <h2>Crea un nou compte</h2>
                </header>
                <label for="register_username">Nom d'usuari</label>
                <input id="register_username" type="text" name="user_name" value="{REGISTER_USERNAME}" />

                <label for="register_email">Correu electrònic</label>

                <input id="register_email" type="email" name="user_email" autocomplete="email" required />

                <label for="birth_date">Data de naixement</label>
                <input id="birth_date" type="date" name="birth_date" required />
                <p id="age-result" aria-live="polite"></p>

                <label for="register_password">Contrasenya</label>
                <div class="password-guidance" id="password-guidance">
                    <strong>Consell:</strong> tria una frase llarga que puguis recordar fàcilment.
                    Calen com a mínim 12 caràcters. Pots fer servir espais, símbols i emojis.
                </div>

                <input id="register_password" type="password" name="user_password"
                    aria-describedby="password-guidance password-count" />
                <label for="password-progress">Longitud de la contrasenya</label>
                <progress id="password-progress" max="12" value="0">0</progress>
                <p id="password-count" aria-live="polite">0 caràcters (mínim 12)</p>
                <label for="confirm_password">Repeteix la contrasenya</label>
                <input id="confirm_password" type="password" autocomplete="new-password"
                    aria-describedby="password-match-result" required />
                <p id="password-match-result" aria-live="polite"></p>
                <input type="submit" name="register" value="Crear compte" />
            </form>
        </section>
        <section>
            <div>
                <a href="{LOGIN_LOGOUT_URL}">{LOGIN_LOGOUT_TEXT}</a>
            </div>
        </section>
    </main>
</body>

</html>
