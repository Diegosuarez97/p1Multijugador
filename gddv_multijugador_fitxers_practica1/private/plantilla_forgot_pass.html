<!DOCTYPE html>
<html lang="ca" color-mode="user">

<head>
    <meta charset="utf-8">
    <title>{SITE_NAME} :: Recuperar contrasenya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="mvp.css">
    <link rel="stylesheet" href="el_meu.css">
</head>

<body>
    <main>
        <header>
            <h1><a href="/">{SITE_NAME}</a></h1>
            <div>{FEEDBACK}</div>
        </header>

        <section>
            <form method="POST" action="/">
                <header>
                    <h2>Recuperar contrasenya</h2>
                </header>

                <label for="forgot_email">Correu electrònic</label>
                <input id="forgot_email" type="email" name="user_email" required />

                <input type="submit" name="forgot_password" value="Enviar enllaç de recuperació" />
            </form>
        </section>

        <section>
            <a href="/?page=login">Tornar a l'inici de sessió</a>
        </section>
    </main>
</body>

</html>
